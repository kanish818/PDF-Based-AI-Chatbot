services:
  - type: web
    runtime: docker
    name: documind-backend
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: pdf-documents
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: FRONTEND_URL
        fromService:
          type: web
          name: documind-frontend-static
          envVarKey: RENDER_EXTERNAL_URL
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: TEMP_DIR
        value: /tmp/documind

  - type: web
    runtime: static
    name: documind-frontend-static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: documind-backend
          envVarKey: RENDER_EXTERNAL_URL
