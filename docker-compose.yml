services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_chatbot_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      PORT: 8000
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf_chatbot_frontend
    environment:
      PORT: 80
      BACKEND_SCHEME: http
      BACKEND_HOSTPORT: backend:8000
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
  chroma_db:
